name: Check secrets

# Verifies required secrets exist and are valid without printing their values.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-secrets.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GOOGLE_SERVICES_JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing. Add it at Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/gs.json
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('/tmp/gs.json'))
          except Exception:
              print("::error::GOOGLE_SERVICES_JSON is not valid JSON (copy the whole file content).")
              sys.exit(1)
          need = {"com.neowarungposs.poskasir", "com.neowarungposs.poskasir.direct", "com.neowarungposs.poskasir.admin"}
          have = {c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])}
          missing = need - have
          if missing:
              print("::error::Missing Firebase Android apps: " + ", ".join(sorted(missing)))
              sys.exit(1)
          print("OK: GOOGLE_SERVICES_JSON valid, 3 Android apps registered.")
          PY
          rm -f /tmp/gs.json
