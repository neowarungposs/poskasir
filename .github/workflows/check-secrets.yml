name: Check secrets

# Verifies required secrets exist and are valid without printing their values.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-secrets.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GOOGLE_SERVICES_JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing. Add it at Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/gs.json
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('/tmp/gs.json'))
          except Exception:
              print("::error::GOOGLE_SERVICES_JSON is not valid JSON (copy the whole file content).")
              sys.exit(1)
          need = {"com.neowarungposs.poskasir", "com.neowarungposs.poskasir.admin"}
          have = {c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])}
          missing = need - have
          if missing:
              print("::error::Missing Firebase Android apps: " + ", ".join(sorted(missing)))
              sys.exit(1)
          print("OK: GOOGLE_SERVICES_JSON valid.")
          PY
          rm -f /tmp/gs.json

      - name: Validate signing key secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ok=1
          for n in KS KS_PW KEY_ALIAS KEY_PW; do
            if [ -z "${!n}" ]; then echo "::error::Secret for $n is empty or missing"; ok=0; else echo "present: $n"; fi
          done
          [ $ok = 1 ] || exit 1
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > /tmp/ks.jks || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          echo "jks sha256 prefix: $(sha256sum /tmp/ks.jks | cut -c1-16)  size: $(stat -c%s /tmp/ks.jks)"
          echo "lengths: store_pw=${#KS_PW} key_pw=${#KEY_PW} alias=${#KEY_ALIAS}"
          keytool -list -keystore /tmp/ks.jks -storepass "$KS_PW" -alias "$KEY_ALIAS" >/dev/null \
            && echo "OK: keystore opens with password and alias" \
            || { echo "::error::Keystore, password or alias does not match"; exit 1; }
          rm -f /tmp/ks.jks
