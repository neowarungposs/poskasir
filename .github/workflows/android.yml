name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**', 'web/**', '.github/workflows/check-secrets.yml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  VERSION_TAG: v1.2.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch display font (Space Grotesk, SIL OFL)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL --retry 4 --retry-delay 3 -o app/src/main/res/font/space_grotesk.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          test "$(stat -c%s app/src/main/res/font/space_grotesk.ttf)" -gt 50000

      - name: Write stable signing key from secret
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Without it every build gets a new key and cannot install over the old app."
            exit 1
          fi
          echo "$KS" | base64 -d > app/keystore.jks

      - name: Build tenant and admin APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --continue assembleTenantDebug assembleAdminDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/tenant/debug/app-tenant-debug.apk dist/KasirWarung-${VERSION_TAG}.apk
          cp app/build/outputs/apk/admin/debug/app-admin-debug.apk   dist/KasirAdmin-${VERSION_TAG}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ env.VERSION_TAG }}-build${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$VERSION_TAG" --cleanup-tag -y || true
          gh release create "$VERSION_TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Kasir Warung $VERSION_TAG (build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} dari commit ${GITHUB_SHA::7}.
          - KasirWarung: aplikasi kasir untuk semua warung (versi Play Store)
          - KasirAdmin: khusus SUPER_ADMIN, jangan dibagikan

          APK testing, ditandatangani kunci tetap: bisa dipasang menimpa versi sebelumnya."
