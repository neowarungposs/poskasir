<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfirmasi Email · Kasir Warung</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#F5F6F2; color:#15201A; }
  main { max-width:480px; margin:0 auto; padding:48px 24px; display:flex; flex-direction:column; gap:16px; line-height:1.55; }
  h1 { margin:0; font-size:26px; }
  .card { background:#fff; border:1px solid #E3E6E0; border-radius:16px; padding:20px; }
  .ok { color:#0A5C3B; } .err { color:#B3261E; }
</style>
</head>
<body>
<main>
  <h1 id="title">Email terkonfirmasi</h1>
  <div class="card" id="text">Akun Anda sudah aktif. Kembali ke aplikasi <b>Kasir Warung</b> lalu masuk dengan email dan password Anda.</div>
</main>
<script>
  // Supabase sends errors in the URL fragment, e.g. #error_code=otp_expired
  const p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (p.get("error")) {
    document.getElementById("title").textContent = "Link sudah tidak berlaku";
    document.getElementById("title").className = "err";
    document.getElementById("text").innerHTML =
      "Link ini sudah dipakai atau kedaluwarsa. Coba <b>masuk</b> di aplikasi Kasir Warung: jika email sudah terkonfirmasi, Anda bisa langsung masuk. Jika belum, daftar ulang untuk menerima link baru.";
  } else {
    document.getElementById("title").className = "ok";
  }
  history.replaceState(null, "", location.pathname); // drop tokens from the address bar
</script>
</body>
</html>
